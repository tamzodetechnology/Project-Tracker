server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:../.env.local[.properties]
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tamzode_tracker}
    username: ${DATABASE_USERNAME:tamzode}
    password: ${DATABASE_PASSWORD:tamzode_local}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
