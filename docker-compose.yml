services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tamzode_tracker
      POSTGRES_USER: tamzode
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tamzode_local}
    ports:
      - "5432:5432"
    volumes:
      - tamzode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamzode -d tamzode_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tamzode-postgres:
